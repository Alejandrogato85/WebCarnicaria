<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCarniceria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="contendor-nav contenedor">
            <div class="logo">
                <img src="img/logo-carni.svg" alt="logo">
            </div>
            <nav class="nav-li">
                <ul class="enlaces">
                    <li class="lista">
                        <a class="enlace" href="index.html">Inicio</a>
                    </li>

                    <li class="lista">
                        <a class="enlace" href="">Nosotros</a>
                    </li>

                    <li class="lista">
                        <a class="enlace" href="">Cortes</a>
                    </li>

                    <li class="lista">
                        <a class="enlace" href="contacto.html">Contacto</a>
                    </li>

                </ul>
            </nav>
        </div>

    </header>



    <main class="contenedor contenedor-principal">
            <h2 class="text-center">contacto</h2>
            <form  class="formulario">
                <fieldset>
                    <legend>Tus datos</legend>
                    <div class="campo">
                        <label for="nombre">Nombre: </label>
                        <input type="text" placeholder="Tu nombre" id="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono: </label>
                        <input type="tel" placeholder="Tu teléfono" id="telefono" required>
                    </div>

                    <div class="campo">
                        <label for="email">Email: </label>
                        <input type="email" placeholder="Tu email" id="email" required>
                    </div>

                    <div class="campo">
                        <label for="mensaje">Mensaje: </label>
                        <textarea id="mensaje" rows="10" cols="20"></textarea>
                    </div>

                </fieldset>

                <input type="submit" value="enviar formulario" class="btn btnm">
            </form>

         

    </main>


    <footer class="contacto" id="contacto">

        <div class="contacto-contenido contenedor">

            <div>
                <h2>Realiza tu pedido</h2>

                <p>
                    Consulta nuestros precios y disponibilidad.
                    Atendemos pedidos para familias, negocios y eventos.
                </p>
            </div>

            <a href="#" class="boton-contacto">
                Contactar por WhatsApp
            </a>

        </div>

    </footer>

    </main>
</body>

</html>
