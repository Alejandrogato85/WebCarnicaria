<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Mirasol</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <header>
        <h1>Óptica Mirasol</h1>
        <p>
            Brindamos atención visual y diferentes servicios para el cuidado de tus ojos.
            Reserva tu cita llenando el siguiente formulario.
        </p>
    </header>

    <main>

        <form id="form-cita" action="procesar.php" method="POST" novalidate>

            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div>
                <label for="consulta">Contanos qué necesitás:</label>
                <textarea id="consulta" name="consulta"></textarea>
            </div>

            <button type="submit">Pedir mi cita</button>

            <p id="aviso-cita" class="aviso"></p>

        </form>

    </main>

    <script src="script.js"></script>



    <footer>
    <p>Parcial 2 - OSCAR ALEJANDRO TOCO CHIRI - 11 de agosto de 2026</p>
</footer>

</body>
</html>
